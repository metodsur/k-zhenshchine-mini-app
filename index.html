<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8f5ef">
<title>к Женщине</title>

<style>
:root{
  --bg:#f8f5ef;
  --paper:rgba(255,255,255,.76);
  --paper2:rgba(255,255,255,.9);
  --text:#343331;
  --muted:#817b73;
  --line:rgba(184,154,107,.24);
  --gold:#c99b55;
  --gold2:#e4c891;
  --shadow:0 18px 45px rgba(97,75,46,.09);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  background:
    radial-gradient(circle at 90% 4%,rgba(237,207,151,.28),transparent 26%),
    radial-gradient(circle at 5% 30%,rgba(255,255,255,.9),transparent 34%),
    linear-gradient(180deg,#faf7f1,#f6f1e9);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button{font:inherit}
button:active{transform:scale(.985)}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  position:relative;
  padding-bottom:112px;
}

.page{
  padding:28px 20px 42px;
  animation:appear .28s ease;
}

@keyframes appear{
  from{opacity:.3;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.eyebrow{
  margin:0 0 12px;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#9d815a;
}

h1{
  margin:0;
  font-size:36px;
  line-height:1.08;
  font-weight:400;
  letter-spacing:-.035em;
}

h2{
  margin:0;
  font-size:27px;
  line-height:1.13;
  font-weight:400;
  letter-spacing:-.025em;
}

h3{
  margin:0;
  font-size:18px;
  line-height:1.3;
  font-weight:500;
}

p{
  line-height:1.55;
  margin:0;
}

.lead{
  margin-top:14px;
  color:#66615b;
  font-size:15px;
  max-width:420px;
}

.hero{
  position:relative;
  overflow:hidden;
  min-height:255px;
  padding:30px 24px;
  border-radius:32px;
  border:1px solid rgba(211,178,124,.25);
  background:
    radial-gradient(circle at 75% 25%,rgba(255,225,163,.72),transparent 24%),
    radial-gradient(circle at 20% 100%,rgba(255,255,255,.9),transparent 38%),
    linear-gradient(135deg,#fffdf8,#f1e5d2);
  box-shadow:var(--shadow);
}

.hero:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border:1px solid rgba(190,145,75,.28);
  border-radius:50%;
  right:-40px;
  top:-25px;
  box-shadow:
    0 0 0 18px rgba(218,181,116,.07),
    0 0 0 38px rgba(218,181,116,.04);
}

.hero>*{position:relative;z-index:1}

.hero-copy{
  max-width:75%;
}

.hero-small{
  margin-top:12px;
  color:#6f675d;
  font-size:14px;
}

.section{
  margin-top:32px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin-bottom:15px;
}

.section-label{
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#9c815b;
}

.card{
  position:relative;
  overflow:hidden;
  padding:20px;
  border-radius:25px;
  border:1px solid var(--line);
  background:var(--paper);
  box-shadow:0 12px 30px rgba(96,72,41,.055);
  backdrop-filter:blur(12px);
}

.card+.card{margin-top:12px}

.gold-card{
  background:
    radial-gradient(circle at 100% 0,rgba(241,204,139,.42),transparent 40%),
    rgba(255,255,255,.8);
}

.card-kicker{
  margin-bottom:8px;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#a28254;
}

.card p{
  margin-top:8px;
  color:#716b64;
  font-size:14px;
}

.row{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid rgba(196,150,82,.36);
  color:#b78643;
  background:rgba(255,252,245,.72);
  font-family:Georgia,serif;
  font-size:21px;
}

.btn{
  width:100%;
  border:0;
  border-radius:999px;
  margin-top:18px;
  padding:15px 20px;
  color:#493b29;
  background:
    linear-gradient(105deg,#e2bd77,#f6dfad 48%,#d9aa60);
  box-shadow:
    0 8px 24px rgba(188,137,63,.22),
    inset 0 1px 0 rgba(255,255,255,.75);
  font-size:13px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  cursor:pointer;
}

.btn-soft{
  color:#6d5a3f;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(195,151,86,.28);
  box-shadow:none;
}

.link{
  border:0;
  background:none;
  padding:0;
  color:#9a7543;
  cursor:pointer;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mini{
  min-height:142px;
  cursor:pointer;
}

.mini .icon{
  width:40px;
  height:40px;
  margin-bottom:18px;
  font-size:18px;
}

.mini h3{
  font-size:15px;
}

.mini p{
  font-size:12px;
}

.cycle{
  margin-top:18px;
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0 6px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#f6dfb5,#fff);
  border:1px solid rgba(194,148,78,.3);
  color:#9a7543;
  font-family:Georgia,serif;
  font-size:18px;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.path-card{
  display:grid;
  grid-template-columns:48px 1fr;
  gap:14px;
  align-items:start;
}

.number{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid rgba(194,148,78,.34);
  color:#ae8144;
  font-family:Georgia,serif;
  font-size:15px;
}

.status{
  display:inline-block;
  margin-top:12px;
  padding:7px 10px;
  border-radius:999px;
  background:#f5ede1;
  color:#927148;
  font-size:11px;
}

.doors{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.door{
  min-height:120px;
  padding:15px;
  border-radius:22px;
  border:1px solid rgba(194,148,78,.22);
  background:rgba(255,255,255,.6);
}

.door b{
  display:block;
  margin-bottom:9px;
  color:#b18449;
  font-family:Georgia,serif;
  font-weight:400;
}

.door span{
  font-size:12px;
  line-height:1.4;
}

.price{
  margin-top:12px;
  font-family:Georgia,serif;
  font-size:28px;
  color:#9d7540;
}

.meeting-date{
  margin:13px 0 6px;
  font-family:Georgia,serif;
  font-size:28px;
  color:#a97e44;
}

.divider{
  height:1px;
  margin:18px 0;
  background:var(--line);
}

.quote{
  padding:25px 20px;
  text-align:center;
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.5;
  color:#695a48;
}

.profile{
  text-align:center;
  padding-top:8px;
}

.profile .avatar{
  width:78px;
  height:78px;
  margin:0 auto 15px;
  font-size:27px;
}

.list-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.list-row:last-child{border-bottom:0}

.back{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:rgba(255,255,255,.72);
  margin-bottom:22px;
  color:#8e744f;
  cursor:pointer;
}

.nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(calc(100% - 24px),496px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 7px;
  border-radius:28px;
  border:1px solid rgba(198,161,105,.22);
  background:rgba(255,255,255,.9);
  box-shadow:0 15px 40px rgba(76,60,40,.14);
  backdrop-filter:blur(20px);
}

.nav button{
  min-width:0;
  border:0;
  background:transparent;
  color:#8a837b;
  padding:5px 2px 4px;
  cursor:pointer;
  font-size:10px;
}

.nav-i{
  width:39px;
  height:39px;
  margin:0 auto 4px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid rgba(192,154,96,.22);
  font-family:Georgia,serif;
  font-size:17px;
}

.nav button.active{
  color:#9c7138;
}

.nav button.active .nav-i{
  background:linear-gradient(145deg,#e4bd76,#f7e3ba);
  border-color:transparent;
  color:#5e4729;
  box-shadow:0 6px 15px rgba(180,129,55,.18);
}

.ritual-list{
  margin-top:15px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.pill{
  padding:9px 11px;
  border-radius:999px;
  border:1px solid rgba(196,151,84,.22);
  background:rgba(255,255,255,.64);
  color:#776958;
  font-size:11px;
}

.questions{
  counter-reset:q;
  margin-top:16px;
}

.question{
  counter-increment:q;
  display:grid;
  grid-template-columns:32px 1fr;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.question:before{
  content:counter(q,decimal-leading-zero);
  color:#b38850;
  font-family:Georgia,serif;
  font-size:13px;
}

@media(max-width:360px){
  h1{font-size:31px}
  .page{padding-left:16px;padding-right:16px}
}
</style>
</head>

<body>
<div id="app" class="app"></div>

<script>
const app=document.getElementById("app");

const mainPages=["space","path","meetings","me"];
let current="space";
let previous="space";

function navigate(page){
  previous=current;
  current=page;
  window.scrollTo({top:0,behavior:"smooth"});
  render();
}

function back(){
  current=previous||"space";
  window.scrollTo({top:0,behavior:"smooth"});
  render();
}

function nav(){
  if(!mainPages.includes(current)) return "";

  const items=[
    ["space","⌂","Пространство"],
    ["path","○","Путь"],
    ["meetings","◇","Встречи"],
    ["me","◯","Я"]
  ];

  return `
  <nav class="nav">
    ${items.map(([id,icon,label])=>`
      <button class="${current===id?"active":""}" onclick="navigate('${id}')">
        <span class="nav-i">${icon}</span>
        ${label}
      </button>
    `).join("")}
  </nav>`;
}

function visibility(){
