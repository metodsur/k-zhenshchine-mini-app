<script>
const app=document.getElementById("app");
let current="home";
let previous="home";
let meetingTab="upcoming";

function go(page){
  previous=current;
  current=page;
  window.scrollTo(0,0);
  render();
}
function back(){
  current=previous||"home";
  window.scrollTo(0,0);
  render();
}

function navigation(){
  const main=["home","space","path","meetings","about"];
  if(!main.includes(current)) return "";

  const items=[
    ["space","✧","Пространство"],
    ["path","◎","Путь"],
    ["meetings","◌","Встречи"],
    ["about","◐","Обо мне"]
  ];

  return `<nav class="nav">
    ${items.map(x=>`
      <button onclick="go('${x[0]}')" class="${current===x[0]?"active":""}">
        <div class="nav-icon">${x[1]}</div>
        ${x[2]}
      </button>
    `).join("")}
  </nav>`;
}
