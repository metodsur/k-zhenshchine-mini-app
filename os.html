<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабинет · к Женщине</title>
<style>
:root{
  --bg:#f6f3ee;--panel:#fffdfa;--ink:#2b3033;--muted:#737b80;--line:#e8e1d6;--soft:#f1ebe2;
  --gold:#a96c22;--gold-2:#c79246;--gold-bg:#f7eedf;--ok:#3f7a5a;--ok-bg:#e6f1ea;--warn:#b5651d;--warn-bg:#fbeee0;--bad:#a8443a;--bad-bg:#f8e7e4;
  --info:#4f6d86;--info-bg:#e7eef4;--shadow:0 1px 2px rgba(60,48,30,.05),0 8px 24px rgba(60,48,30,.06);--r:16px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:#fbf8f3;display:flex;flex-direction:column;gap:26px}
.brand{padding:0 10px}
.brand b{display:block;font-weight:300;font-size:1.15rem;letter-spacing:.14em;text-transform:uppercase}
.brand span{display:block;margin-top:4px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:11px;background:none;text-align:left;font-size:.95rem;color:#4a5155}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-group{margin:14px 12px 4px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#a0a6a9}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--gold-bg);color:#7a4a12;font-weight:400}
.nav .count{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--gold);color:#fff;font-size:.72rem;text-align:center;font-weight:400}
.me{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.me b{display:block;color:var(--ink);font-weight:400}
.me button{margin-top:8px;padding:0;border:0;background:none;color:var(--gold);font-size:.82rem}
main{min-width:0;padding:30px 36px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.head h1{margin:0;font-weight:200;font-size:2rem;letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.vault-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}@media(max-width:700px){.vault-grid{grid-template-columns:1fr}}
.vcard{padding:18px 20px 16px}
.vcard h3{margin:0;font-size:1.12rem;font-weight:400;display:flex;align-items:center;gap:8px;justify-content:space-between}
.vcard .open{font-size:.82rem;color:var(--gold);text-decoration:none;word-break:break-all}
.vrow{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;margin-top:10px;font-size:.9rem}
.vrow .k{color:var(--muted);font-size:.78rem}
.vrow code{font:.92rem ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:4px 8px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vrow .acts{display:flex;gap:4px}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:.78rem;cursor:pointer;white-space:nowrap}
.icon-btn:hover{border-color:#d7c6ad}
.vmeta{margin-top:12px;font-size:.75rem;color:var(--muted)}
.vnotes{margin-top:10px;font-size:.85rem;color:#555;white-space:pre-wrap}
.tcomment{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fbf1de;border-left:3px solid #b77a2b}
.tcomment small{display:block;font-size:.74rem;color:#8a6a3c;margin-bottom:3px}
.tcomment p{margin:0;font-size:1.02rem;font-weight:600;line-height:1.4;color:#2c2a26;white-space:pre-wrap;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:#d7c6ad}
.btn.gold{border-color:transparent;background:linear-gradient(115deg,#8c5517,#b0722a 55%,#c9944a);color:#fff;font-weight:400}
.btn.gold:hover{filter:brightness(1.05)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:none;color:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>h2,.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:16px 18px 10px;font-size:.78rem;font-weight:400;letter-spacing:.15em;text-transform:uppercase;color:#5d6468}
.panel-h h2{margin:0;font:inherit}
.empty{padding:14px 18px 20px;color:var(--muted);font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi strong{display:block;margin-top:6px;font-size:1.75rem;font-weight:200;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:.78rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2>.wide{grid-column:1/-1}
.rows{list-style:none;margin:0;padding:0 8px 10px}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:11px}
.rows li.click{cursor:pointer}
.rows li.click:hover{background:var(--soft)}
.rows .main{min-width:0;flex:1}
.rows .main b{font-weight:400}
.rows .sub{display:block;color:var(--muted);font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-pill{flex:none;width:52px;text-align:center;padding:6px 0;border-radius:10px;background:var(--soft);font-size:.72rem;line-height:1.15;color:#5d6468;text-transform:uppercase;letter-spacing:.05em}
.date-pill b{display:block;font-size:1.05rem;font-weight:300;color:var(--ink);letter-spacing:0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:400;background:var(--soft);color:#5d6468;white-space:nowrap}
.tag.new{background:var(--info-bg);color:var(--info)}
.tag.contact,.tag.dialog,.tag.offer{background:var(--gold-bg);color:#85521a}
.tag.paid{background:var(--ok-bg);color:var(--ok)}
.tag.followup{background:#efe8f5;color:#6b4f86}
.tag.refused{background:var(--bad-bg);color:var(--bad)}
.tag.over{background:var(--bad-bg);color:var(--bad)}
.tag.blocker{background:var(--bad-bg);color:var(--bad)}
.tag.inapp{background:var(--ok-bg);color:var(--ok)}
.k-cycle{border-left:3px solid var(--gold)}
.k-club{border-left:3px solid #8a6fb0}
.k-entry{border-left:3px solid var(--info)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c79246,#a96c22)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search],.toolbar select{padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);min-width:0}
.toolbar input[type=search]{width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:.82rem;color:#4a5155}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{font-style:normal;opacity:.6;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 13px;border-radius:99px;font-size:.84rem;color:#5d6468}
.seg button.on{background:var(--gold-bg);color:#7a4a12}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:400;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid #f0eae0;vertical-align:top;font-size:.9rem}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#fbf7f0}
td .sub{display:block;color:var(--muted);font-size:.8rem}
.table-wrap{overflow:auto;max-height:calc(100vh - 230px);border-radius:var(--r)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#f1ece4;border-radius:var(--r);padding:10px;min-height:200px}
.col h3{display:flex;justify-content:space-between;margin:4px 6px 10px;font-size:.76rem;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:#5d6468}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:.88rem}
.kcard:hover{border-color:#d7c6ad}
.kcard .sub{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.drawer-bg{position:fixed;inset:0;background:rgba(43,48,51,.28);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(560px,100vw);background:var(--panel);box-shadow:-10px 0 40px rgba(40,30,20,.16);display:flex;flex-direction:column}
.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-weight:300;font-size:1.45rem}
.drawer .body{padding:18px 24px 30px;overflow:auto;flex:1}
.x{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--muted);padding:0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.field span{display:block;margin-bottom:5px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{outline:2px solid #e3c999;outline-offset:0;border-color:#d9bd8c}
.dt{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:6px}
.dt input{min-width:0}
.brand b{white-space:nowrap}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;font-size:.82rem;cursor:pointer}
.checks input{width:auto!important;margin:0;accent-color:var(--gold)}
.checks label{white-space:nowrap}
.section-t{margin:22px 0 10px;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.history{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.history li{position:relative;padding:0 0 14px 16px;font-size:.88rem}
.history li:before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--gold-2)}
.history time{display:block;color:var(--muted);font-size:.76rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.errors{margin:10px 0 0;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:.86rem}
.notice{margin:0 0 14px;padding:11px 16px;border-radius:12px;background:var(--warn-bg);color:#7a4a12;font-size:.88rem}
.cycles{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.cycle{padding:18px 20px}
.cycle-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cycle h3{margin:0;font-weight:300;font-size:1.3rem}
.cycle .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.dates{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0 12px}
.dates div{padding:7px 4px;border-radius:10px;background:var(--soft);text-align:center;font-size:.74rem;color:#5d6468;line-height:1.2}
.dates div b{display:block;font-weight:400;font-size:.86rem;color:var(--ink)}
.dates div.past{opacity:.55}
.dates div.none b{color:var(--muted);font-weight:300}
.fill{display:flex;align-items:center;gap:10px;font-size:.84rem;color:#5d6468}
.fill .bar{flex:1}
.people{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:.86rem}
.people div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.people .sub{color:var(--muted)}
.cal-head{display:flex;align-items:center;gap:10px}
.cal-head h2{margin:0 6px;font-weight:300;font-size:1.3rem;min-width:170px;text-align:center;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.month .dow{padding:9px 10px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fbf8f3}
.day{min-height:112px;padding:7px 7px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.78rem}
.day.out{background:#faf8f4;color:#b0b5b8}
.day.today .n{background:var(--gold);color:#fff}
.day .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:.8rem;margin-bottom:4px}
.ev{display:block;width:100%;text-align:left;margin-bottom:3px;padding:3px 6px;border:0;border-radius:6px;font-size:.74rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.cycle{background:var(--gold-bg);color:#7a4a12}
.ev.club{background:#efe8f5;color:#5e4580}
.ev.content{background:#fde9ec;color:#9a3d55}
.ev.media{background:#e3f1ee;color:#2f6b5f}
.ev.entry{background:var(--info-bg);color:var(--info)}
.ev.varvara{box-shadow:inset 3px 0 0 var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px 0;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px}
.task:hover{background:var(--soft)}
.task input{margin-top:4px;accent-color:var(--gold)}
.task .main{flex:1;min-width:0}
.task .sub{display:block;color:var(--muted);font-size:.8rem}
.task .del{border:0;background:none;color:#b0b5b8;font-size:1.1rem;visibility:hidden}
.task:hover .del{visibility:visible}
.add-task{display:flex;gap:8px;padding:6px 16px 16px;flex-wrap:wrap}
.add-task input{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.add-task input[type=date]{flex:none;width:150px}
.add-task input[type=checkbox]{flex:none;width:auto;min-width:0;padding:0}
.add-task label{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;color:#5d6468}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(226,194,137,.25),transparent 420px),var(--bg)}
.login .card{max-width:440px;padding:40px 38px;text-align:center}
.login h1{margin:14px 0 10px;font-weight:200;font-size:1.9rem}
.login p{color:#5d6468;margin:0 0 10px}
.login code{padding:2px 8px;border-radius:6px;background:var(--gold-bg);color:#7a4a12;font-size:.95rem}
.check-list{list-style:none;margin:0;padding:4px 10px 12px}
.check-list li{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-radius:12px}
.check-list li:hover{background:#fbf7f0}
.check-list li>input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:var(--gold)}
.check-list li.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:#c9b79c}
.check-list .main{flex:1;min-width:0}
.check-list .sub{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.block-tag{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:99px;background:var(--soft);color:#6a7175;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
.check-res{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:8px;font-size:.82rem}
.check-res.ok{background:var(--ok-bg);color:var(--ok)}
.check-res.warn{background:var(--bad-bg);color:var(--bad)}
.check-res.info{background:var(--info-bg);color:var(--info)}
.modal{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;padding:26px 28px 22px;border-radius:22px;background:var(--panel);box-shadow:0 30px 80px rgba(40,30,20,.28)}
.modal h2{margin:6px 0 14px;font-weight:300;font-size:1.5rem}
.modal-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.modal-block>.sub{color:var(--muted);font-size:.84rem}
.modal-list{list-style:none;margin:8px 0 0;padding:0}
.modal-list li{display:flex;gap:10px;padding:7px 0;font-size:.92rem}
.modal-list .sub{display:block;color:var(--muted);font-size:.82rem}
.dot{flex:none;width:9px;height:9px;margin-top:7px;border-radius:50%;background:var(--info)}
.dot.warn{background:var(--bad)}
.dot.ok{background:var(--ok)}
.mine-toggle{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:.84rem;color:#5d6468;cursor:pointer;white-space:nowrap}
.mine-toggle.on{background:var(--gold-bg);border-color:#e3c999;color:#7a4a12}
.mine-toggle input{margin:0;accent-color:var(--gold)}
.panel-h .mine-toggle{padding:4px 10px;font-size:.74rem;letter-spacing:0;text-transform:none}
table.att{min-width:420px}
table.att th{position:static;padding:6px 6px;text-align:center;font-size:.7rem}
table.att th:first-child,table.att td:first-child{text-align:left}
table.att td{padding:7px 6px;text-align:center;border-bottom:1px solid #f0eae0;cursor:default}
table.att tbody tr{cursor:default}
table.att td.na{color:#c5c9cb}
table.att input{width:17px;height:17px;accent-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;padding:11px 20px;border-radius:99px;background:var(--ink);color:#fff;font-size:.9rem;box-shadow:var(--shadow)}
.loading{padding:40px 0;color:var(--muted)}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .nav-group{display:none}
  .app{grid-template-columns:1fr}
  .side{position:sticky;z-index:10;height:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand span,.me{display:none}
  .nav{flex-direction:row}
  .nav button{padding:8px 10px;white-space:nowrap}
  main{padding:20px 16px 50px}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cycles{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .day{min-height:80px}
  .toolbar input[type=search]{width:100%}
}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="card panel">
    <div class="eyebrow">к Женщине · кабинет управления</div>
    <h1>Вход для команды</h1>
    <p id="login-text">Напишите боту <a id="bot-link" href="https://t.me/K_zhenshcine_bot" target="_blank" rel="noopener">@K_zhenshcine_bot</a> команду <code>/dashboard</code> и откройте присланную ссылку.</p>
    <p class="eyebrow" style="margin-top:18px">Ссылка действует 15 минут, вход сохраняется на 30 дней</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><b>к Женщине</b><span>Операционная система</span></div>
    <nav class="nav" id="nav"></nav>

          cell.appendChild(h("button", { type: "button", class: "ev " + it.kind + (it.varvara ? " varvara" : ""), title: [it.time, it.title, it.place, it.meta, it.seats ? "занято " + it.seats : ""].filter(Boolean).join(" · "),
            text: (it.time ? it.time + " " : "") + it.title, onclick: function () { openEntry(it, d.can_edit); } }));
        });
        month.appendChild(cell);
      }
      var title = m.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
      setView([
        h("div", { class: "head" }, h("div", null, h("div", { class: "eyebrow", text: "Единый календарь" }), h("h1", { text: "Календарь" }), h("p", { text: "Встречи циклов, клуб, публикации, медийные выходы, съёмки и консультации" })),
          h("div", { class: "cal-head" },
            h("button", { class: "btn small", type: "button", text: "←", onclick: function () { state.cal.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); viewCalendar(); } }),
            h("h2", { text: title }),
            h("button", { class: "btn small", type: "button", text: "→", onclick: function () { state.cal.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); viewCalendar(); } }),
            d.can_edit ? h("button", { class: "btn gold", type: "button", text: "+ Событие", onclick: function () { openEntry(null, true); } }) : null)),
        month,
        h("div", { class: "legend" }, h("span", null, h("i", { style: "background:#f7eedf;border:1px solid #c79246" }), "Встречи циклов"), h("span", null, h("i", { style: "background:#efe8f5" }), "Клуб (из админки приложения)"), h("span", null, h("i", { style: "background:#fde9ec" }), "Публикации контента"), h("span", null, h("i", { style: "background:#e3f1ee" }), "Медийные выходы"), h("span", null, h("i", { style: "background:#e7eef4" }), "Съёмки, консультации и другое"), h("span", null, h("i", { style: "background:#e7eef4;box-shadow:inset 3px 0 0 #a96c22" }), "С участием Варвары"))
      ]);
    });
  }
  function openEntry(it, canEdit) {
    if (it && it.kind === "cycle") { go("cycles"); return; }
    if (it && (it.kind === "content" || it.kind === "media")) { state.openItem = { name: it.kind, id: it.ref }; go(it.kind); return; }
    if (it && it.kind === "club") { toast("Клубные события редактируются в админке приложения → События"); return; }
    var dict = state.me.dict, body = h("div"), errBox = h("div");
    it = it || { date: iso(new Date()), time: "", title: "", type: "shoot", place: "", notes: "", varvara: true };
    var f = {
      title: h("input", { value: it.title, disabled: !canEdit }), type: select(Object.keys(dict.calendar_types).map(function (k) { return [k, dict.calendar_types[k]]; }), it.type, { disabled: !canEdit }),
      date: h("input", { type: "date", value: it.date, disabled: !canEdit }), time: h("input", { type: "time", value: it.time || "", disabled: !canEdit }),
      place: h("input", { value: it.place || "", disabled: !canEdit }), notes: h("textarea", { text: it.notes || "", disabled: !canEdit }),
      varvara: h("input", { type: "checkbox", checked: it.varvara, disabled: !canEdit })
    };
    var dr = drawer(it.id ? it.title : "Новое событие", "Календарь", body);
    add(body, [h("div", { class: "form" }, field("Название", f.title, "full"), field("Тип", f.type), field("Место / ссылка", f.place), field("Дата", f.date), field("Время", f.time),
      h("div", { class: "full checks" }, h("label", null, f.varvara, "С участием Варвары (её календарь)")), field("Заметки", f.notes, "full")), errBox,
      canEdit ? h("div", { class: "actions" },
        it.id ? h("button", { class: "btn ghost", type: "button", text: "Удалить", onclick: function () { if (!confirm("Удалить событие?")) return; api("calendar", { action: "remove", id: it.id }).then(function () { dr.close(); viewCalendar(); }); } }) : null,
        h("button", { class: "btn gold", type: "button", text: "Сохранить", onclick: function () {
          api("calendar", { action: "save", entry: { id: it.id || null, title: f.title.value, type: f.type.value, date: f.date.value, time: f.time.value, place: f.place.value, notes: f.notes.value, varvara: f.varvara.checked } }).then(function (r) {
            errBox.innerHTML = ""; if (!r.ok) return errBox.appendChild(errorsBox(r));
            dr.close(); toast("Сохранено"); viewCalendar();
          });
        } })) : null]);
  }

  // ---------- boot ----------
  var match = location.hash.match(/login=([a-f0-9]+)/);
  var boot = match
    ? api("login", { token: match[1] }).then(function (d) { history.replaceState(null, "", location.pathname + "#today"); return d.ok ? d : (showLogin(d.error), null); })
    : api("me");
  boot.then(function (d) { if (d && d.ok) start(d); else showLogin(d && d.error); })
      .catch(function () { showLogin(); });
})();
